name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No signing keys or secrets in the repo
        run: |
          if git ls-files | grep -E '\.(jks|keystore)$|keystore\.properties$'; then
            echo "Signing material must not be committed"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests, lint, debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TARJUMAN-reports
          path: |
            app/build/reports/**
            app/build/test-results/**

      - uses: actions/upload-artifact@v4
        with:
          name: TARJUMAN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
